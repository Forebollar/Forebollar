    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FCFCFB; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .toast {
            position: fixed; bottom: 30px; right: 30px; background: #14231C; color: white;
            padding: 15px 25px; border-radius: 4px; box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            opacity: 0; transform: translateY(20px); transition: all 0.4s ease; z-index: 100;
            font-size: 14px; letter-spacing: 0.05em;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        #sort-order option {
            background-color: #1c3127;
            color: #fff;
            padding: 10px;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
        }

        .sort-wrapper {
            position: relative;
            display: inline-block;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="text-neutral-900 antialiased">

    </div>

                </a>
                <a href="clothes.html" title="Kläder">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 4L7 6M15 4l2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-14 0l2-2h8l2 2m-12 0h12m-8 4h4" /></svg>
                </a>
            </div>
    
            <div class="flex justify-center">
                <a href="index.html">
                    <img src="logowebb.png" alt="Forebollar Logo" class="h-8 w-auto object-contain">

                </a>
                <button class="text-[#14231C] relative ml-1" onclick="toggleCart()">

                    <span id="cart-count-mobile" class="absolute -top-1 -right-2 bg-[#14231C] text-[#E5D3B3] text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    
        <div class="hidden md:flex justify-between items-center w-full">
            <div class="font-serif text-2xl tracking-[0.3em] font-semibold text-[#14231C] uppercase">Forebollar</div>
            <div class="flex space-x-8 text-xs tracking-widest uppercase font-medium text-stone-600">
                <a href="index.html" class="hover:text-neutral-900">Hem</a>
                <a href="golfbollar.html" class="text-neutral-900 border-b border-[#14231C]">Golfbollar</a>
                <a href="clothes.html" class="hover:text-neutral-900">Kläder</a>
                <a href="about.html" class="hover:text-neutral-900">Info</a>
            </div>
            <div class="flex items-center">
                <button class="text-stone-700 relative" onclick="toggleCart()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <span id="cart-count-desktop" class="absolute -top-1 -right-2 bg-[#14231C] text-[#E5D3B3] text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="relative h-[35vh] w-full bg-stone-900 flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image: url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=1200&q=80');"></div>
        <div class="relative z-10 text-center px-6">
            <h1 class="font-serif text-4xl md:text-6xl text-white font-light tracking-wide">Vårt Sortiment</h1>
        </div>
    </header>

    <div class="flex justify-end mb-10 px-1">
        <div class="sort-wrapper group">
            <select id="sort-order" onchange="sortProducts()" 
                class="appearance-none bg-transparent border-b border-stone-200 text-[#14231C] text-[10px] tracking-[0.2em] uppercase font-semibold py-2 pl-2 pr-10 cursor-pointer transition-all duration-300 hover:border-[#14231C] focus:outline-none rounded-none">
                <option value="default" disabled selected>Sortera efter</option>
                <option value="low-high">Pris: Lågt till högt</option>
                <option value="high-low">Pris: Högt till lågt</option>
            </select>
            
            <div class="absolute inset-y-0 right-0 flex items-center pointer-events-none">
                <svg class="w-3 h-3 text-stone-400 group-hover:text-[#14231C] transform group-hover:translate-y-0.5 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
        </div>
    </div>

    <section class="px-4 py-12 md:px-12 max-w-7xl mx-auto">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-10 md:gap-x-6 md:gap-y-12">
            </div>
    </section>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[450px] bg-[#FCFCFB] z-50 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out hidden flex-col text-neutral-900">
        <div class="p-6 flex justify-between items-center border-b border-stone-100">
            <h2 class="font-serif text-xl tracking-wide font-semibold">Din Varukorg</h2>
            <button onclick="toggleCart()" class="text-stone-500 text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-6 no-scrollbar"></div>
        <div class="p-6 border-t border-stone-100 bg-white">
            <div class="flex justify-between text-sm mb-4">
                <span class="text-stone-500 tracking-widest uppercase text-[10px]">Totalt</span>
                <span id="cart-total" class="font-medium text-[#14231C]">0.00 kr</span>
            </div>
            <div class="px-6 py-4 border-t border-stone-100">
                <div class="flex space-x-2">
                    <input type="text" id="discount-input" placeholder="Rabattkod" class="flex-grow border border-stone-200 p-2 text-[10px] uppercase tracking-widest focus:outline-none focus:border-[#14231C]">
                    <button onclick="applyDiscount()" class="bg-stone-200 px-4 py-2 text-[10px] uppercase tracking-widest font-bold">Använd</button>
                </div>
                <p id="discount-msg" class="text-[9px] mt-1 hidden"></p>
            </div>
            <button onclick="openOrderModal()" class="w-full bg-[#14231C] text-[#E5D3B3] py-4 text-xs tracking-widest uppercase font-semibold">Gå till beställning</button>
        </div>
    </div>
    <div id="cart-backdrop" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40 hidden" onclick="toggleCart()"></div>

    <div id="orderModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md p-8 rounded-sm shadow-2xl relative text-neutral-900">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 text-stone-400 text-2xl">&times;</button>
            <h2 class="font-serif text-2xl text-[#14231C] mb-6 text-center">Slutför Beställning</h2>
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                <input type="email" id="email" required placeholder="E-postadress" class="w-full border border-stone-200 p-3 text-sm focus:outline-none focus:border-[#14231C]">
                <input type="tel" id="phone" required placeholder="Telefonnummer" class="w-full border border-stone-200 p-3 text-sm focus:outline-none focus:border-[#14231C]">
                <div id="orderSummary" class="bg-stone-50 p-4 text-xs space-y-2 border border-stone-100 max-h-40 overflow-y-auto"></div>
                <button type="submit" class="w-full bg-[#14231C] text-white py-4 text-xs tracking-widest uppercase font-semibold">Skicka Beställning</button>
            </form>
        </div>
    </div>

    <footer class="bg-[#14231C] text-white py-12 px-6 text-center">
        <div class="font-serif text-xl tracking-[0.2em] text-[#E5D3B3] mb-4 uppercase">Forebollar</div>
        <p class="text-[10px] text-stone-500 tracking-widest uppercase">© 2024 Forebollar</p>
        <div class="mt-4 flex justify-center">
            <button onclick="openAdmin()" class="text-stone-800 opacity-100 hover:opacity-100 transition duration-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </button>
        </div>
    </footer>

    <div id="adminModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-white w-full max-w-2xl p-8 rounded-sm shadow-2xl max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-serif text-2xl text-[#14231C]">Lagerhantering</h2>
                <button onclick="closeAdmin()" class="text-stone-400 text-2xl">&times;</button>
            </div>
            <div id="admin-list" class="space-y-4">
                </div>
            <button onclick="saveAdminStock()" class="w-full mt-8 bg-[#14231C] text-white py-4 text-xs tracking-widest uppercase font-semibold hover:bg-stone-800">
                Spara alla ändringar
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
        emailjs.init("M8hlcCoiJItfe70PT");
    
        const firebaseConfig = {
            apiKey: "AIzaSyAYKWVCNLFYMZ9B6QhNXquVG2CyprVtYBc",
            authDomain: "forebollar-e4ae6.firebaseapp.com",
            projectId: "forebollar-e4ae6",
            storageBucket: "forebollar-e4ae6.firebasestorage.app",
            messagingSenderId: "354593259653",
            appId: "1:354593259653:web:d80f65293f00de4ff769ec",
            measurementId: "G-Y629ZF5S4F",
            databaseURL: "https://forebollar-e4ae6-default-rtdb.europe-west1.firebasedatabase.app"
        };
    
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
    
        let products = [
            { id: "pro-v1", name: "Titleist Pro V1/V1x - 12st", price: 200, comparePrice: 599, image: "Golfbollar/Pro-V1.jpg", description: "Pro V1 är golfbollen som presterar maximalt..." },
            { id: "blandat", name: "Blandade Märken - 25st", price: 200, comparePrice: 399, image: "Golfbollar/blandade-bollar.jpg", description: "En lagom mix..." },
            { id: "pga-tour", name: "PGA Tour Mix - 25st", price: 360, comparePrice: 700, image: "Golfbollar/pga.jpg", description: "En perfekt mix..." },
            { id: "tour-mix", name: "Tour Mix - 12st", price: 180, comparePrice: 375, image: "Golfbollar/tour-mix.jpg", description: "En mix full av prisvärda tourbollar..." },
            { id: "chrome-soft", name: "Callaway Chrome Soft - 12st", price: 175, comparePrice: 349, image: "Golfbollar/chromesoft.jpg", description: "Det är en mjuk och förlåtande tourboll..." },
            { id: "tp5", name: "Taylormade TP5 Mix - 12st", price: 190, comparePrice: 399, image: "Golfbollar/taylormade-tp5.jpg", description: "TP5, En 5-delad golfboll..." },
            { id: "taylormade", name: "Taylormade Mix - 12st", price: 135, comparePrice: 279, image: "Golfbollar/taylormade.jpg", description: "En mycket populär mix..." },
            { id: "florida", name: "Florida Mix - 25st", price: 180, comparePrice: 279, image: "Golfbollar/florida-mix.jpg", description: "En perfekt mix av golfbollar..." },
            { id: "callaway", name: "Callaway Mix - 12st", price: 130, comparePrice: 250, image: "Golfbollar/callaway.jpg", description: "Innehåller en blandning av modeller..." },
            { id: "titleist-mix", name: "Titleist Mix - 12st", price: 140, comparePrice: 299, image: "Golfbollar/titleist-mix.jpg", description: "Mix av olika modeller..." },
            { id: "farg-mix", name: "Färg Mix - 12st", price: 150, comparePrice: 350, image: "Golfbollar/färg-mix.jpg", description: "Färgglada bollar för bättre synlighet..." },
            { id: "wilson", name: "Wilson Mix - 12st", price: 110, comparePrice: 160, image: "Golfbollar/wilson-mix.jpg", description: "Bra kvalitet till fantastiskt pris..." },
            { id: "srixon", name: "Srixon Mix - 12st", price: 120, comparePrice: 190, image: "Golfbollar/srixon.jpg", description: "Prisvärd mix, perfekt för medelhandicapare..." }
        ];
    
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
    
        function startStockListener() {
            const stockRef = ref(db, 'stocks');
            onValue(stockRef, (snapshot) => {
                const data = snapshot.val();
                
                if (data) {
                    products = products.map(p => ({
                        ...p,
                        stockFirst: (data[p.id] && data[p.id].first !== undefined) ? data[p.id].first : 0,
                        stockSecond: (data[p.id] && data[p.id].second !== undefined) ? data[p.id].second : 0
                    }));
                    console.log("Lager uppdaterat från Firebase:", data);
                } else {
                    console.log("Databasen är tom. Kör setupInitialStock() i konsolen för att ladda upp 10/15.");
                    
                    products = products.map(p => ({
                        ...p,
                        stockFirst: 0,
                        stockSecond: 0
                    }));
                }
                renderProducts(); 
            });
        }
    
        // 4. Rendering & UI
        window.renderProducts = function() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map((p, i) => `
                <div class="group flex flex-col justify-between">
                    <div>
                        <div class="relative bg-[#F9F9F8] aspect-square overflow-hidden mb-3">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
                            <div id="stock-tag-${i}" class="absolute top-2 left-2 text-[8px] tracking-widest uppercase px-2 py-1 z-10 text-white font-bold"></div>
                        </div>
                        <div class="flex justify-between items-start mb-1 px-1">
                            <p class="text-[9px] text-stone-400 uppercase tracking-widest">Premium</p>
                            <span class="text-[9px] font-serif italic text-stone-400 line-through">${p.comparePrice} kr</span>
                        </div>
                        <h3 class="font-medium text-xs md:text-sm text-neutral-800 tracking-wide px-1 h-9 overflow-hidden">${p.name}</h3>
                        <div class="mt-2 flex items-center justify-between px-1">
                            <p id="price-display-${i}" class="font-serif italic text-sm md:text-base text-[#14231C]"></p>
                            <select id="quality-${i}" onchange="updateProductDisplay(${i})" class="text-[9px] md:text-[10px] uppercase tracking-tighter border-none bg-transparent focus:outline-none cursor-pointer text-stone-500 font-bold">
                                <option value="secondhand">2:a Klass</option>
                                <option value="firsthand">1:a Klass</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="addToCart(${i})" class="mt-4 border border-stone-200 text-[9px] md:text-[10px] uppercase tracking-[0.1em] font-bold py-3 hover:bg-[#14231C] hover:text-[#E5D3B3] transition duration-300">
                        + Lägg till
                    </button>
                </div>
            `).join('');
            products.forEach((_, i) => updateProductDisplay(i));
        };

        window.sortProducts = function() {
            const sortOrder = document.getElementById('sort-order').value;
            
            if (sortOrder === "low-high") {
                products.sort((a, b) => a.price - b.price);
            } else if (sortOrder === "high-low") {
                products.sort((a, b) => b.price - a.price);
            }
            
            renderProducts();
        };
    
        window.updateProductDisplay = function(index) {
            const product = products[index];
            const quality = document.getElementById(`quality-${index}`).value;
            const priceEl = document.getElementById(`price-display-${index}`);
            const stockTag = document.getElementById(`stock-tag-${index}`);
            const btn = document.querySelector(`button[onclick="addToCart(${index})"]`);
            
            let finalPrice = quality === "firsthand" ? product.price * 1.5 : product.price;
            let currentStock = quality === "firsthand" ? product.stockFirst : product.stockSecond;
            
            let stockText = "";
            let bgColor = "";

            if (currentStock <= 0 || currentStock === undefined) {
                stockText = "Slutsåld";
                bgColor = "#ef4444"; // Röd
                btn.disabled = true;
                btn.innerText = "Slutsåld";
                btn.className = "mt-4 border border-stone-200 text-[9px] md:text-[10px] uppercase tracking-[0.1em] font-bold py-3 opacity-50 cursor-not-allowed";
            } else if (currentStock === 1) {
                stockText = "Endast 1 kvar!";
                bgColor = "#f59e0b"; // Orange
                btn.disabled = false;
                btn.innerText = "+ Lägg till";
                btn.className = "mt-4 border border-stone-200 text-[9px] md:text-[10px] uppercase tracking-[0.1em] font-bold py-3 hover:bg-[#14231C] hover:text-[#E5D3B3] transition duration-300";
            } else {
                stockText = "Finns i lager";
                bgColor = "#14231C"; // Grön/Mörk
                btn.disabled = false;
                btn.innerText = "+ Lägg till";
                btn.className = "mt-4 border border-stone-200 text-[9px] md:text-[10px] uppercase tracking-[0.1em] font-bold py-3 hover:bg-[#14231C] hover:text-[#E5D3B3] transition duration-300";
            }
            
            priceEl.innerText = `${finalPrice.toFixed(0)} kr`;
            stockTag.innerText = stockText;
            stockTag.style.backgroundColor = bgColor;
        };

        window.addToCart = function(index) {
            const quality = document.getElementById(`quality-${index}`).value;
            const product = products[index];
            const isFirst = quality === "firsthand";
            
            const currentAvailable = isFirst ? product.stockFirst : product.stockSecond;
            
            const inCartCount = cart.filter(item => 
                item.id === product.id && item.quality === (isFirst ? "1:a Klass" : "2:a Klass")
            ).length;

            if (inCartCount >= currentAvailable) {
                showToast(`Tyvärr, vi har bara ${currentAvailable}st i lager.`);
                return;
            }

            const finalPrice = isFirst ? product.price * 1.5 : product.price;
            
            cart.push({
                ...product,
                price: finalPrice.toFixed(0),
                quality: isFirst ? "1:a Klass" : "2:a Klass"
            });
            
            saveCart();
            updateCartUI();
            showToast(`${product.name} tillagd`);
        };
    
        window.submitOrder = function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            
            let orderLines = cart.map(item => `• ${item.name} (${item.quality}) - ${item.price} kr`).join('\n');
            let total = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
    
            emailjs.send("service_hopnllq", "template_9k0lu8p", {
                customer_email: email,
                phone: phone,
                order: `Ny beställning:\n${orderLines}\n\nTotal: ${total} kr`
            }).then(() => {
                const updates = {};
                cart.forEach(item => {
                    const p = products.find(prod => prod.name === item.name);
                    if (p) {
                        const isFirst = item.quality === "1:a Klass";
                        const currentStock = isFirst ? p.stockFirst : p.stockSecond;
                        updates[`stocks/${p.id}/${isFirst ? 'first' : 'second'}`] = Math.max(0, currentStock - 1);
                    }
                });
    
                update(ref(db), updates).then(() => {
                    showToast("Tack för din beställning!");
                    cart = []; 
                    saveCart(); 
                    updateCartUI(); 
                    closeOrderModal(); 
                    toggleCart(false);
                });
            });
        };
    
        window.saveCart = () => localStorage.setItem("cart", JSON.stringify(cart));
        let currentDiscount = 0;

        window.applyDiscount = function() {
            const code = document.getElementById('discount-input').value.toUpperCase();
            const msg = document.getElementById('discount-msg');
            
            if (code === "FORE10") {
                currentDiscount = 0.10;
                msg.innerText = "10% rabatt applicerad!";
                msg.className = "text-[9px] mt-1 text-green-700 block";
            } else {
                currentDiscount = 0;
                msg.innerText = "Ogiltig kod.";
                msg.className = "text-[9px] mt-1 text-red-700 block";
            }
            updateCartUI();
        };
        window.updateCartUI = () => {
            const countMobile = document.getElementById('cart-count-mobile');
            const countDesktop = document.getElementById('cart-count-desktop');
            if(countMobile) countMobile.innerText = cart.length;
            if(countDesktop) countDesktop.innerText = cart.length;
            
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-xs text-stone-400 italic text-center py-12">Varukorgen är tom.</p>';
                totalEl.innerText = '0 kr';
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map((item, i) => {
                subtotal += parseFloat(item.price);
                return `
                    <div class="flex justify-between items-center border-b border-stone-50 pb-4">
                        <div class="flex items-center space-x-4">
                            <img src="${item.image}" class="w-12 h-12 object-cover bg-stone-100">
                            <div>
                                <h4 class="text-[10px] font-bold text-stone-800 uppercase">${item.name}</h4>
                                <p class="text-[9px] text-stone-400 uppercase tracking-widest">${item.quality}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-serif italic text-sm text-[#14231C]">${item.price} kr</p>
                            <button onclick="removeFromCart(${i})" class="text-[8px] text-red-800 uppercase font-bold">Ta bort</button>
                        </div>
                    </div>
                `;
            }).join('');

            let discountAmount = subtotal * currentDiscount;
            let finalTotal = subtotal - discountAmount;

            if (currentDiscount > 0) {
                totalEl.innerHTML = `
                    <div class="flex flex-col items-end">
                        <span class="line-through text-stone-400 text-[10px]">${subtotal.toFixed(0)} kr</span>
                        <span class="text-[#14231C] font-bold">${finalTotal.toFixed(0)} kr</span>
                    </div>
                `;
            } else {
                totalEl.innerText = `${subtotal.toFixed(0)} kr`;
            }
        };

        window.removeFromCart = (i) => { cart.splice(i, 1); saveCart(); updateCartUI(); };
        window.toggleCart = (force = null) => {
            const sb = document.getElementById('cart-sidebar');
            const bd = document.getElementById('cart-backdrop');
            const open = force !== null ? force : sb.classList.contains('hidden');
            if (open) { sb.classList.remove('hidden'); bd.classList.remove('hidden'); setTimeout(() => sb.classList.remove('translate-x-full'), 10); }
            else { sb.classList.add('translate-x-full'); setTimeout(() => { sb.classList.add('hidden'); bd.classList.add('hidden'); }, 300); }
        };
    
        window.openOrderModal = () => {
            if (cart.length === 0) return;
            const summary = document.getElementById('orderSummary');
            let total = cart.reduce((s, i) => s + parseFloat(i.price), 0);
            summary.innerHTML = cart.map(item => `<div class="flex justify-between"><span>${item.name}</span><span>${item.price} kr</span></div>`).join('') + `<div class="border-t mt-2 pt-2 font-bold flex justify-between"><span>Totalt</span><span>${total} kr</span></div>`;
            document.getElementById('orderModal').style.display = 'flex';
        };
    
        window.closeOrderModal = () => document.getElementById('orderModal').style.display = 'none';
    
        window.showToast = (msg) => {
            const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
            document.body.appendChild(t); setTimeout(() => t.classList.add('show'), 100);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500); }, 3000);
        };
    
        // Initiera
        window.setupInitialStock = () => {
            const initial = {};
            products.forEach(p => initial[p.id] = { first: 10, second: 15 });
            set(ref(db, 'stocks'), initial).then(() => alert("Klar!"));
        };
    
        window.onload = () => { startStockListener(); updateCartUI(); };

        // --- ADMIN LOGIK ---
        window.openAdmin = function() {
            const password = prompt("Ange administratörslösenord:");
            if (password === "Forebollar21") { // Ändra till ditt eget lösenord!
                renderAdminList();
                document.getElementById('adminModal').style.display = 'flex';
            } else if (password !== null) {
                alert("Fel lösenord!");
            }
        };

        window.closeAdmin = function() {
            document.getElementById('adminModal').style.display = 'none';
        };

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = products.map((p, i) => `
                <div class="flex flex-col md:flex-row md:items-center justify-between border-b pb-4 gap-4">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" class="w-10 h-10 object-cover">
                        <span class="text-xs font-bold uppercase">${p.name}</span>
                    </div>
                    <div class="flex space-x-4">
                        <div class="flex flex-col">
                            <label class="text-[9px] uppercase text-stone-400">1:a Klass</label>
                            <input type="number" id="admin-first-${p.id}" value="${p.stockFirst}" class="w-20 border p-2 text-sm focus:outline-none focus:border-[#14231C]">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[9px] uppercase text-stone-400">2:a Klass</label>
                            <input type="number" id="admin-second-${p.id}" value="${p.stockSecond}" class="w-20 border p-2 text-sm focus:outline-none focus:border-[#14231C]">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.saveAdminStock = function() {
            const updates = {};
            products.forEach(p => {
                const firstVal = parseInt(document.getElementById(`admin-first-${p.id}`).value);
                const secondVal = parseInt(document.getElementById(`admin-second-${p.id}`).value);
                
                updates[`stocks/${p.id}/first`] = firstVal;
                updates[`stocks/${p.id}/second`] = secondVal;
            });

            import('https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js').then(({ ref, update }) => {
                const db = getDatabase();
                update(ref(db), updates).then(() => {
                    showToast("Lagret har uppdaterats!");
                    closeAdmin();
                }).catch(err => {
                    console.error(err);
                    alert("Kunde inte spara till databasen.");
                });
            });
        };
    </script>
</body>
</html>
