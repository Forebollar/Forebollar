<!DOCTYPE html>
<html lang="sv" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOREBOLLAR</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FCFCFB; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .toast {
            position: fixed; bottom: 30px; right: 30px; background: #14231C; color: white;
            padding: 15px 25px; border-radius: 4px; box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            opacity: 0; transform: translateY(20px); transition: all 0.4s ease; z-index: 100;
            font-size: 14px; letter-spacing: 0.05em;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="text-neutral-900 antialiased">

    <div class="bg-[#14231C] text-[#E5D3B3] text-[10px] tracking-[0.2em] uppercase py-2 text-center font-medium px-4">
        100% återvunna golfbollar • Miljövänlig precision
    </div>

    <nav class="sticky top-0 z-50 bg-[#FCFCFB]/90 backdrop-blur-md border-b border-stone-100 px-4 py-4 md:px-8">
        <div class="grid grid-cols-3 items-center md:hidden">
            <div class="flex items-center space-x-5 text-stone-600">
                <a href="index.html" class="text-[#14231C]" title="Hem">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </a>
                <a href="golfbollar.html" title="Bollar">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                </a>
                <a href="clothes.html" title="Kläder">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 4L7 6M15 4l2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-14 0l2-2h8l2 2m-12 0h12m-8 4h4" /></svg>
                </a>
            </div>
    
            <div class="flex justify-center">
                <a href="index.html">
                    <img src="logowebb.png" alt="Forebollar Logo" class="h-8 w-auto object-contain">
                </a>
            </div>
    
            <div class="flex justify-end items-center space-x-4 text-stone-600">
                <a href="about.html" title="Info">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </a>
                <button class="text-[#14231C] relative ml-1" onclick="toggleCart()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <span id="cart-count-mobile" class="absolute -top-1 -right-2 bg-[#14231C] text-[#E5D3B3] text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    
        <div class="hidden md:flex justify-between items-center w-full">
            <div class="font-serif text-2xl tracking-[0.3em] font-semibold text-[#14231C] uppercase">Forebollar</div>
            <div class="flex space-x-8 text-xs tracking-widest uppercase font-medium text-stone-600">
                <a href="index.html" class="text-neutral-900 border-b border-[#14231C]">Hem</a>
                <a href="golfbollar.html" class="hover:text-neutral-900">Golfbollar</a>
                <a href="clothes.html" class="hover:text-neutral-900">Kläder</a>
                <a href="about.html" class="hover:text-neutral-900">Info</a>
            </div>
            <div class="flex items-center">
                <button class="text-stone-700 relative" onclick="toggleCart()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <span id="cart-count-desktop" class="absolute -top-1 -right-2 bg-[#14231C] text-[#E5D3B3] text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="relative h-[35vh] w-full bg-stone-900 flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image: url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=1200&q=80');"></div>
        <div class="relative z-10 text-center px-6">
            <h1 class="font-serif text-4xl md:text-6xl text-white font-light tracking-wide">Vårt Sortiment</h1>
        </div>
    </header>

    <section class="px-4 py-12 md:px-12 max-w-7xl mx-auto">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-10 md:gap-x-6 md:gap-y-12">
            </div>
    </section>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[450px] bg-[#FCFCFB] z-50 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out hidden flex-col text-neutral-900">
        <div class="p-6 flex justify-between items-center border-b border-stone-100">
            <h2 class="font-serif text-xl tracking-wide font-semibold">Din Varukorg</h2>
            <button onclick="toggleCart()" class="text-stone-500 text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-6 no-scrollbar"></div>
        <div class="p-6 border-t border-stone-100 bg-white">
            <div class="flex justify-between text-sm mb-4">
                <span class="text-stone-500 tracking-widest uppercase text-[10px]">Totalt</span>
                <span id="cart-total" class="font-medium text-[#14231C]">0.00 kr</span>
            </div>
            <button onclick="openOrderModal()" class="w-full bg-[#14231C] text-[#E5D3B3] py-4 text-xs tracking-widest uppercase font-semibold">Gå till beställning</button>
        </div>
    </div>
    <div id="cart-backdrop" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40 hidden" onclick="toggleCart()"></div>

    <div id="orderModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md p-8 rounded-sm shadow-2xl relative text-neutral-900">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 text-stone-400 text-2xl">&times;</button>
            <h2 class="font-serif text-2xl text-[#14231C] mb-6 text-center">Slutför Beställning</h2>
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                <input type="email" id="email" required placeholder="E-postadress" class="w-full border border-stone-200 p-3 text-sm focus:outline-none focus:border-[#14231C]">
                <input type="tel" id="phone" required placeholder="Telefonnummer" class="w-full border border-stone-200 p-3 text-sm focus:outline-none focus:border-[#14231C]">
                <div id="orderSummary" class="bg-stone-50 p-4 text-xs space-y-2 border border-stone-100 max-h-40 overflow-y-auto"></div>
                <button type="submit" class="w-full bg-[#14231C] text-white py-4 text-xs tracking-widest uppercase font-semibold">Skicka Beställning</button>
            </form>
        </div>
    </div>

    <footer class="bg-[#14231C] text-white py-12 px-6 text-center">
        <div class="font-serif text-xl tracking-[0.2em] text-[#E5D3B3] mb-4 uppercase">Forebollar</div>
        <p class="text-[10px] text-stone-500 tracking-widest uppercase">© 2024 Forebollar</p>
    </footer>

    <script>
        emailjs.init("M8hlcCoiJItfe70PT");

        const products = [
            { name: "Titleist Pro V1/V1x - 12st", price: 200, comparePrice: 599, image: "Golfbollar/Pro-V1.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "Pro V1 är golfbollen som presterar maximalt i alla delar av spelet med ökad längd, låg spinn från tee och penetrerande bollflykt." },
            { name: "Blandade Märken - 25st", price: 200, comparePrice: 399, image: "Golfbollar/blandade-bollar.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "En lagom mix mellan olika golfbolls märken för dig som letar efter lite högre kvalitet än floridabollar fast till ett bra pris. Omslags bilden för denna mix ger en bra indikation på vad du kan förvänta dig." },
            { name: "PGA Tour Mix - 25st", price: 360, comparePrice: 700, image: "Golfbollar/pga.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "En perfekt mix av golfbollar som syns på pga touren, detta är en mix för dig som vill ha högsta möjliga prestanda på dina golfbollar. I denna mix inngår: ProV1/V1x, Tp5/Tp5x/Tp5Pix, Chorme Soft/Tour, Bridgestone Tour BXs, Srixon Z-Star." },
            { name: "Tour Mix - 12st", price: 180, comparePrice: 375, image: "Golfbollar/tour-mix.jpg", stockStatusFirsthand: "Få i lager", stockStatusSecondhand: "Finns i lager", description: "En mix full av prisvärda tourbollar, I mixen kan följande bollar förekomma: Titleist Tour Soft/Speed, Callaway Chrome Soft/Tour, Bridgestone Tour B XS, Srixon Z-Star, Vice Pro, m.m." },
            { name: "Callaway Chrome Soft - 12st", price: 175, comparePrice: 349, image: "Golfbollar/chromesoft.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "Det är en mjuk och förlåtande tourboll som ger otrolig känsla och fantastisk spinnkontroll i de kortare slagen. Golfbollens hyperelastika SoftFast-kärna bidrar dessutom till låg spinn i utslagen samt exceptionell distans. " },
            { name: "Taylormade TP5 Mix - 12st", price: 190, comparePrice: 399, image: "Golfbollar/taylormade-tp5.jpg", stockStatusFirsthand: "Slutsåld", stockStatusSecondhand: "Slutsåld", description: "TP5, En 5-delad golfboll designad för att fungera för alla golfare som vill spela på en tourboll av högsta prestanda." },
            { name: "Taylormade Mix - 12st", price: 135, comparePrice: 279, image: "Golfbollar/taylormade.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "En mycket populär och prisvärd mix av bollar från Taylormade." },
            { name: "Florida Mix - 25st", price: 180, comparePrice: 279, image: "Golfbollar/florida-mix.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "En perfekt mix av golfbollar för dig som vill köpa prisvärda bollar utan att det spelar så stor roll exakt vilka modeller det är." },
            { name: "Callaway Mix - 12st", price: 130, comparePrice: 250, image: "Golfbollar/callaway.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "Callaway Mix innehåller en blandning av olika modeller och generationer golfbollar från Callaway som passar alla spelstilar." },
            { name: "Titleist Mix - 12st", price: 140, comparePrice: 299, image: "Golfbollar/titleist-mix.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "Titleist Mix innehåller en mix av olika modeller och generationer golfbollar som passar alla spelstilar." },
            { name: "Färg Mix - 12st", price: 150, comparePrice: 350, image: "Golfbollar/färg-mix.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "Färgglada bollar från alla märken, för bättre synlighet på banan." },
            { name: "Wilson Mix - 12st", price: 110, comparePrice: 160, image: "Golfbollar/wilson-mix.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: "En mix av Wilson golfbollar – bra kvalitet till ett fantastiskt pris, perfekt för spelare som vill ha pålitliga bollar utan att spräcka budgeten! " },
            { name: "Srixon Mix - 12st", price: 120, comparePrice: 190, image: "Golfbollar/srixon.jpg", stockStatusFirsthand: "Finns i lager", stockStatusSecondhand: "Finns i lager", description: " Här kan du köpa en prisvärd mix av Srixons golfbollar, perfekt för medel och höghandicapare. Mixen innehåller populära modeller som Q-Star, Distance, Hi-Spin och AD333, m.m." },
        ];

        // BEVARAD REA-LOGIK
        const sales = [
            { productName: "*", discountPercent: 0, startDate: "2020-09-23", endDate: "2020-06-30", quality: "both" }
        ];

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function isSaleActive(sale, productName, quality) {
            const now = new Date();
            const start = new Date(sale.startDate);
            const end = new Date(sale.endDate);
            if (now < start || now > end) return false;
            if (sale.productName !== "*" && sale.productName !== productName) return false;
            if (sale.quality !== "both" && sale.quality !== quality) return false;
            return true;
        }

        function getDiscountedPrice(productName, originalPrice, quality) {
            let activeSale = sales.find(s => isSaleActive(s, productName, quality));
            if (activeSale) {
                return originalPrice * (1 - activeSale.discountPercent / 100);
            }
            return originalPrice;
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map((p, i) => `
                <div class="group flex flex-col justify-between">
                    <div>
                        <div class="relative bg-[#F9F9F8] aspect-square overflow-hidden mb-3">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
                            <div id="stock-tag-${i}" class="absolute top-2 left-2 text-[8px] tracking-widest uppercase px-2 py-1 z-10 text-white font-bold"></div>
                        </div>
                        <div class="flex justify-between items-start mb-1 px-1">
                            <p class="text-[9px] text-stone-400 uppercase tracking-widest">Premium</p>
                            <span class="text-[9px] font-serif italic text-stone-400 line-through">${p.comparePrice} kr</span>
                        </div>
                        <h3 class="font-medium text-xs md:text-sm text-neutral-800 tracking-wide px-1 h-9 overflow-hidden">${p.name}</h3>
                        <div class="mt-2 flex items-center justify-between px-1">
                            <p id="price-display-${i}" class="font-serif italic text-sm md:text-base text-[#14231C]"></p>
                            <select id="quality-${i}" onchange="updateProductDisplay(${i})" class="text-[9px] md:text-[10px] uppercase tracking-tighter border-none bg-transparent focus:outline-none cursor-pointer text-stone-500 font-bold">
                                <option value="secondhand">2:a Klass</option>
                                <option value="firsthand">1:a Klass</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="addToCart(${i})" class="mt-4 border border-stone-200 text-[9px] md:text-[10px] uppercase tracking-[0.1em] font-bold py-3 hover:bg-[#14231C] hover:text-[#E5D3B3] transition duration-300">
                        + Lägg till
                    </button>
                </div>
            `).join('');
            
            products.forEach((_, i) => updateProductDisplay(i));
        }

        function updateProductDisplay(index) {
            const product = products[index];
            const quality = document.getElementById(`quality-${index}`).value;
            const priceEl = document.getElementById(`price-display-${index}`);
            const stockTag = document.getElementById(`stock-tag-${index}`);
            
            let basePrice = quality === "firsthand" ? product.price * 1.5 : product.price;
            let finalPrice = getDiscountedPrice(product.name, basePrice, quality);
            let stock = quality === "firsthand" ? product.stockStatusFirsthand : product.stockStatusSecondhand;
            
            priceEl.innerText = `${finalPrice.toFixed(2)} kr`;
            stockTag.innerText = stock;
            stockTag.style.backgroundColor = (stock === "Finns i lager" || stock === "I lager") ? "#14231C" : "#D97706";
        }

        function addToCart(index) {
            const qualitySelect = document.getElementById(`quality-${index}`);
            const quality = qualitySelect.value;
            const product = products[index];
            
            let basePrice = quality === "firsthand" ? product.price * 1.5 : product.price;
            let finalPrice = getDiscountedPrice(product.name, basePrice, quality);
            
            cart.push({
                ...product,
                price: finalPrice.toFixed(2),
                quality: quality === "firsthand" ? "1:a Klass" : "2:a Klass",
                category: "golfballs"
            });
            
            saveCart();
            updateCartUI();
            showToast(`${product.name} tillagd`);
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const countEl = document.getElementById('cart-count');
            countEl.innerText = cart.length;
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-xs text-stone-400 italic text-center py-12">Varukorgen är tom.</p>';
                totalEl.innerText = '0.00 kr';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, i) => {
                total += parseFloat(item.price);
                return `
                    <div class="flex justify-between items-center border-b border-stone-50 pb-4">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-stone-100"><img src="${item.image}" class="w-full h-full object-cover"></div>
                            <div>
                                <h4 class="text-[11px] font-bold text-stone-800 uppercase">${item.name}</h4>
                                <p class="text-[9px] text-stone-400 uppercase tracking-widest">${item.quality}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-serif italic text-sm text-[#14231C]">${item.price} kr</p>
                            <button onclick="removeFromCart(${i})" class="text-[8px] text-red-800 uppercase font-bold">Ta bort</button>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.innerText = `${total.toFixed(2)} kr`;
        }

        function removeFromCart(i) { cart.splice(i, 1); saveCart(); updateCartUI(); }
        function saveCart() { localStorage.setItem("cart", JSON.stringify(cart)); }
        function toggleCart(force = null) {
            const sb = document.getElementById('cart-sidebar');
            const bd = document.getElementById('cart-backdrop');
            const open = force !== null ? force : sb.classList.contains('hidden');
            if (open) { sb.classList.remove('hidden'); bd.classList.remove('hidden'); setTimeout(() => sb.classList.remove('translate-x-full'), 10); }
            else { sb.classList.add('translate-x-full'); setTimeout(() => { sb.classList.add('hidden'); bd.classList.add('hidden'); }, 300); }
        }

        function openOrderModal() {
            if (cart.length === 0) return;
            const summary = document.getElementById('orderSummary');
            let total = 0;
            summary.innerHTML = cart.map(item => {
                total += parseFloat(item.price);
                return `<div class="flex justify-between"><span>${item.name} (${item.quality})</span><span>${item.price} kr</span></div>`;
            }).join('') + `<div class="border-t border-stone-200 mt-2 pt-2 font-bold flex justify-between"><span>Totalt</span><span>${total.toFixed(2)} kr</span></div>`;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

        function submitOrder(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            let totalPrice = 0;
            let orderLines = cart.map(item => {
                totalPrice += parseFloat(item.price);
                return `• ${item.name} (${item.quality}) - ${item.price} kr`;
            }).join("\n");

            const orderDetails = `Ny beställning:\n${orderLines}\nTotal: ${totalPrice.toFixed(2)} kr\nE-post: ${email}\nTfn: ${phone}`;

            emailjs.send("service_hopnllq", "template_9k0lu8p", { customer_email: email, phone: phone, order: orderDetails })
                .then(() => {
                    showToast("Beställning skickad!");
                    cart = []; saveCart(); updateCartUI(); closeOrderModal(); toggleCart(false);
                })
                .catch(err => showToast("Fel vid skickning: " + err));
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.classList.add('show'), 100);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500); }, 3000);
        }

        window.onload = () => { renderProducts(); updateCartUI(); };
    </script>
</body>
</html>
