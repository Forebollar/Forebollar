<!DOCTYPE html>
<html lang="sv" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOREBOLLAR</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14231C">
    <link rel="apple-touch-icon" href="logowebb.png">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FCFCFB; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .slider-container { position: relative; width: 100%; overflow: hidden; }
        .product-slider { display: flex; transition: transform 0.5s ease-in-out; gap: 1.5rem; }
        
        .toast {
            position: fixed; bottom: 30px; right: 30px; background: #14231C; color: white;
            padding: 15px 25px; border-radius: 4px; box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            opacity: 0; transform: translateY(20px); transition: all 0.4s ease; z-index: 100;
            font-size: 14px; letter-spacing: 0.05em;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="text-neutral-900 antialiased">

    <div class="bg-[#14231C] text-[#E5D3B3] text-[10px] tracking-[0.2em] uppercase py-2 text-center font-medium px-4">
        Välkommen till Forebollar • "Fore your wallet"
    </div>

    <nav class="sticky top-0 z-40 bg-[#FCFCFB]/90 backdrop-blur-md border-b border-stone-100 px-4 py-4 flex justify-between items-center md:px-8">
        <div class="flex md:hidden items-center space-x-5 text-stone-600">
            <a href="index.html" class="text-[#14231C]" title="Hem">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            </a>
            <a href="golfbollar.html" title="Bollar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            </a>
            <a href="clothes.html" title="Kläder">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 4L7 6M15 4l2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-14 0l2-2h8l2 2m-12 0h12m-8 4h4" />
                </svg>
            </a>
            <a href="about.html" title="Info">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </a>
        </div>
        
        <div class="font-serif text-xl md:text-2xl tracking-[0.3em] font-semibold text-[#14231C] uppercase">
            Forebollar
        </div>
        
        <div class="hidden md:flex space-x-8 text-xs tracking-widest uppercase font-medium text-stone-600">
            <a href="index.html" class="text-neutral-900 border-b border-[#14231C]">Hem</a>
            <a href="golfbollar.html" class="hover:text-neutral-900">Golfbollar</a>
            <a href="clothes.html" class="hover:text-neutral-900">Kläder</a>
            <a href="about.html" class="hover:text-neutral-900">Info</a>
        </div>

        <div class="flex items-center space-x-4">
            <button class="text-stone-700 relative" onclick="toggleCart()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span id="cart-count" class="absolute -top-1 -right-2 bg-[#14231C] text-[#E5D3B3] text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </nav>

    <header class="relative h-[80vh] w-full bg-stone-900 flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image: url('https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="relative z-10 text-center px-6">
            <h1 class="font-serif text-5xl md:text-8xl text-white font-light tracking-tight mb-6">FOREBOLLAR</h1>
            <p class="text-[#E5D3B3] text-xs md:text-sm tracking-[0.4em] uppercase mb-10">Premium Återvunna Golfbollar</p>
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <a href="golfbollar.html" class="bg-white text-[#14231C] px-10 py-4 text-[10px] tracking-[0.2em] uppercase font-bold hover:bg-[#E5D3B3] transition duration-300">Shoppa Bollar</a>
                <a href="clothes.html" class="border border-white text-white px-10 py-4 text-[10px] tracking-[0.2em] uppercase font-bold hover:bg-white hover:text-[#14231C] transition duration-300">Se Kollektionen</a>
            </div>
        </div>
    </header>

    <section class="py-20 px-4 md:px-12 max-w-7xl mx-auto overflow-hidden">
        <div class="flex justify-between items-end mb-12">
            <div>
                <p class="text-[10px] text-stone-400 uppercase tracking-[0.3em] mb-2">Utvalda Produkter</p>
                <h2 class="font-serif text-3xl md:text-4xl text-[#14231C]">Mest Populära</h2>
            </div>
            <div class="flex space-x-4 mb-1">
                <button id="prev" class="p-2 border border-stone-200 rounded-full hover:bg-stone-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <button id="next" class="p-2 border border-stone-200 rounded-full hover:bg-stone-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>

        <div class="slider-container">
            <div id="slider-track" class="product-slider">
                </div>
        </div>
    </section>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[450px] bg-[#FCFCFB] z-50 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out hidden flex-col">
        <div class="p-6 flex justify-between items-center border-b border-stone-100">
            <h2 class="font-serif text-xl tracking-wide font-semibold text-[#14231C]">Din Varukorg</h2>
            <button onclick="toggleCart()" class="text-stone-500 text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-6 no-scrollbar"></div>
        <div class="p-6 border-t border-stone-100 bg-white">
            <div class="flex justify-between text-sm mb-4">
                <span class="text-stone-500 tracking-widest uppercase text-[10px]">Totalt</span>
                <span id="cart-total" class="font-medium text-[#14231C]">0.00 kr</span>
            </div>
            <button onclick="openOrderModal()" class="w-full bg-[#14231C] text-[#E5D3B3] py-4 text-xs tracking-widest uppercase font-semibold">Gå till beställning</button>
        </div>
    </div>
    <div id="cart-backdrop" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40 hidden" onclick="toggleCart()"></div>

    <div id="orderModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md p-8 rounded-sm shadow-2xl relative">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 text-stone-400 text-2xl">&times;</button>
            <h2 class="font-serif text-2xl text-[#14231C] mb-6 text-center">Beställning</h2>
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4 text-neutral-900">
                <input type="email" id="email" required placeholder="E-postadress" class="w-full border border-stone-200 p-3 text-sm focus:outline-none focus:border-[#14231C]">
                <input type="tel" id="phone" required placeholder="Telefonnummer" class="w-full border border-stone-200 p-3 text-sm focus:outline-none focus:border-[#14231C]">
                <div id="orderSummary" class="bg-stone-50 p-4 text-[10px] space-y-1 border border-stone-100 max-h-40 overflow-y-auto"></div>
                <button type="submit" class="w-full bg-[#14231C] text-white py-4 text-xs tracking-widest uppercase font-semibold">Skicka Beställning</button>
            </form>
        </div>
    </div>

    <footer class="bg-[#14231C] text-white py-20 px-6 text-center">
        <div class="font-serif text-3xl tracking-[0.3em] font-semibold text-[#E5D3B3] mb-8 uppercase">Forebollar</div>
        <div class="flex justify-center space-x-8 text-[10px] tracking-[0.3em] uppercase text-[#E5D3B3]">
            <a href="golfbollar.html" class="hover:text-white transition">Bollar</a>
            <a href="clothes.html" class="hover:text-white transition">Kläder</a>
            <a href="about.html" class="hover:text-white transition">Info</a>
        </div>
        <div class="mt-16 pt-8 border-t border-white/5 text-[9px] text-stone-600 tracking-[0.2em] uppercase italic">
            © 2024 Forebollar
        </div>
    </footer>

    <script>
        emailjs.init("M8hlcCoiJItfe70PT");

        const products = [
            { name: "Titleist Pro V1/V1x - 12st", price: 200, image: "Golfbollar/Pro-V1.jpg", link: "golfbollar.html" },
            { name: "Golf Pike Navy/White", price: 299, image: "PikeBlW.png", link: "clothes.html" },
            { name: "PGA Tour Mix - 25st", price: 360, image: "Golfbollar/pga.jpg", link: "golfbollar.html" },
            { name: "Golf Keps Green/White", price: 499, image: "CapWG.png", link: "clothes.html" },
            { name: "Blandade Märken - 25st", price: 200, image: "Golfbollar/blandade-bollar.jpg", link: "golfbollar.html" }
        ];

        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let currentIndex = 0;

        function renderSlider() {
            const track = document.getElementById('slider-track');
            track.innerHTML = products.map((p, i) => `
                <div class="min-w-[280px] md:min-w-[320px] group">
                    <a href="${p.link}">
                        <div class="relative aspect-[3/4] bg-[#F9F9F8] overflow-hidden mb-4">
                            <img src="${p.image}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition duration-500"></div>
                        </div>
                        <p class="text-[10px] text-stone-400 uppercase tracking-widest mb-1">Visa Produkt</p>
                        <h3 class="font-medium text-sm text-[#14231C] tracking-wide uppercase">${p.name}</h3>
                        <p class="font-serif italic text-base mt-1 text-stone-600">${p.price} kr</p>
                    </a>
                </div>
            `).join('');
        }

        function updateSlider() {
            const track = document.getElementById('slider-track');
            const cardWidth = track.children[0].offsetWidth + 24; // Width + gap
            track.style.transform = `translateX(${-currentIndex * cardWidth}px)`;
        }

        document.getElementById('next').addEventListener('click', () => {
            if (currentIndex < products.length - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        document.getElementById('prev').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        // Cart Functions (Same as golfbollar/clothes)
        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            document.getElementById('cart-count').innerText = cart.length;
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-xs text-stone-400 italic text-center py-12">Varukorgen är tom.</p>';
                totalEl.innerText = '0.00 kr';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, i) => {
                total += parseFloat(item.price);
                return `
                    <div class="flex justify-between items-center border-b border-stone-50 pb-4">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-stone-100"><img src="${item.image}" class="w-full h-full object-cover"></div>
                            <div>
                                <h4 class="text-[10px] font-bold text-stone-800 uppercase">${item.name}</h4>
                                <p class="text-[9px] text-stone-400 uppercase tracking-widest">${item.quality || item.size || ''}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-serif italic text-sm text-[#14231C]">${item.price} kr</p>
                            <button onclick="removeFromCart(${i})" class="text-[8px] text-red-800 uppercase font-bold">Ta bort</button>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.innerText = `${total.toFixed(2)} kr`;
        }

        function toggleCart(force = null) {
            const sb = document.getElementById('cart-sidebar');
            const bd = document.getElementById('cart-backdrop');
            const open = force !== null ? force : sb.classList.contains('hidden');
            if (open) { sb.classList.remove('hidden'); bd.classList.remove('hidden'); setTimeout(() => sb.classList.remove('translate-x-full'), 10); }
            else { sb.classList.add('translate-x-full'); setTimeout(() => { sb.classList.add('hidden'); bd.classList.add('hidden'); }, 300); }
        }

        function removeFromCart(i) { cart.splice(i, 1); localStorage.setItem("cart", JSON.stringify(cart)); updateCartUI(); }
        
        function openOrderModal() {
            if (cart.length === 0) return;
            const summary = document.getElementById('orderSummary');
            let total = 0;
            summary.innerHTML = cart.map(item => {
                total += parseFloat(item.price);
                return `<div class="flex justify-between"><span>${item.name}</span><span>${item.price} kr</span></div>`;
            }).join('') + `<div class="border-t border-stone-200 mt-2 pt-2 font-bold flex justify-between"><span>Totalt</span><span>${total.toFixed(2)} kr</span></div>`;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

        function submitOrder(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            let orderLines = cart.map(it => `• ${it.name} - ${it.price} kr`).join('\n');
            let total = cart.reduce((s, i) => s + parseFloat(i.price), 0);

            emailjs.send("service_hopnllq", "template_9k0lu8p", {
                customer_email: email,
                phone: phone,
                order: `Hemsida Beställning:\n${orderLines}\nTotal: ${total.toFixed(2)} kr`
            }).then(() => {
                showToast("Beställning mottagen!");
                cart = []; localStorage.setItem("cart", JSON.stringify(cart)); updateCartUI(); closeOrderModal(); toggleCart(false);
            });
        }

        function showToast(msg) {
            const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
            document.body.appendChild(t); setTimeout(() => t.classList.add('show'), 100);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500); }, 3000);
        }

        window.onload = () => { renderSlider(); updateCartUI(); };
        window.addEventListener('resize', updateSlider);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registrerad!'))
            .catch(err => console.log('Service Worker fel:', err));
        });
        }
    </script>
</body>
</html>
